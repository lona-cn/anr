name: CI and Release

on:
  push:
    branches: [main, master]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ANR_DFN3_MODEL: ${{ github.workspace }}/models/dfn3.onnx

jobs:
  prepare:
    name: Release policy
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      tag: ${{ steps.metadata.outputs.tag }}
      label: ${{ steps.metadata.outputs.label }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      commit: ${{ steps.metadata.outputs.commit }}
      native_version: ${{ steps.metadata.outputs.native_version }}
      native_commit: ${{ steps.metadata.outputs.native_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication event boundaries
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Require matching version tags
        id: metadata
        run: python .github/scripts/release_metadata.py

  native-cli:
    needs: prepare
    name: ${{ matrix.platform.name }} / Rust stable
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    env:
      NATIVE_VERSION: ${{ needs.prepare.outputs.native_version }}
      NATIVE_COMMIT: ${{ needs.prepare.outputs.native_commit }}
      PACKAGE_LABEL: ${{ needs.prepare.outputs.label }}
      PACKAGE_TARGET: ${{ matrix.platform.host }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            runner: windows-2025
            host: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - name: macOS arm64
            runner: macos-15
            host: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-15-intel
            host: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc -vV
          python -c "import subprocess; info = subprocess.check_output(['rustc', '-vV'], text=True); assert 'host: ${{ matrix.platform.host }}' in info, info"
          echo "ORT_CACHE_DIR=$RUNNER_TEMP/ort-cache" >> "$GITHUB_ENV"
      - name: Install Linux CPU build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libssl-dev
      - name: Download and verify the model and its licenses
        run: python .github/scripts/fetch_release_assets.py model --output-dir models
      - name: Download verified CPU runtime distribution
        if: matrix.platform.host != 'x86_64-apple-darwin'
        run: python .github/scripts/fetch_release_assets.py runtime --target "$PACKAGE_TARGET" --output-dir "$RUNNER_TEMP/ort-distribution"
      # Official CPU archives omit Intel macOS. Keep the pinned source build,
      # caching its libraries and notices together, never libraries alone.
      - name: Cache Intel macOS CPU runtime and notices
        if: matrix.platform.host == 'x86_64-apple-darwin'
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ort-distribution
          key: ort-cpu-${{ matrix.platform.host }}-${{ needs.prepare.outputs.native_commit }}-${{ hashFiles('.github/workflows/ci.yml', '.github/onnxruntime.json') }}
      - name: Install Intel macOS CPU build prerequisites
        if: matrix.platform.host == 'x86_64-apple-darwin' && steps.ort-cache.outputs.cache-hit != 'true'
        run: python -m pip install 'cmake>=3.28,<4' ninja packaging numpy
      - name: Build pinned Intel macOS CPU shared library
        if: matrix.platform.host == 'x86_64-apple-darwin' && steps.ort-cache.outputs.cache-hit != 'true'
        env:
          ORT_SOURCE: ${{ runner.temp }}/onnxruntime-source
          ORT_BUILD: ${{ runner.temp }}/onnxruntime-build
        run: |
          git clone --branch "v$NATIVE_VERSION" --depth 1 --recursive https://github.com/microsoft/onnxruntime.git "$ORT_SOURCE"
          test "$(git -C "$ORT_SOURCE" rev-parse HEAD)" = "$NATIVE_COMMIT"
          python "$ORT_SOURCE/tools/ci_build/build.py" --build_dir "$ORT_BUILD" --config Release --update --build --build_shared_lib --parallel 3 --skip_tests --cmake_generator Ninja --compile_no_warning_as_error --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=x86_64
          mkdir -p "$RUNNER_TEMP/ort-distribution/lib"
          cp -L "$ORT_BUILD/Release/libonnxruntime"*.dylib "$RUNNER_TEMP/ort-distribution/lib/"
          cp "$ORT_SOURCE/LICENSE" "$ORT_SOURCE/ThirdPartyNotices.txt" "$RUNNER_TEMP/ort-distribution/"
      - name: Configure Intel macOS default linking
        if: matrix.platform.host == 'x86_64-apple-darwin'
        run: |
          test -f "$RUNNER_TEMP/ort-distribution/lib/libonnxruntime.dylib"
          test -f "$RUNNER_TEMP/ort-distribution/ThirdPartyNotices.txt"
          echo "ORT_LIB_LOCATION=$RUNNER_TEMP/ort-distribution/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/ort-distribution/lib" >> "$GITHUB_ENV"
      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.runner }}-${{ hashFiles('.github/workflows/ci.yml', '.github/onnxruntime.json') }}
          cache-directories: ${{ runner.temp }}/ort-cache
      - name: Build actual native CLI with CPU backend
        run: cargo build --locked -p anr-cli
      - name: Run SDK-free workspace and native CLI process tests
        run: cargo test --locked --workspace --exclude anr-tensorrt --exclude anr-openvino --all-targets
      - name: Run CPU DFN3 real-model test
        run: cargo test --locked -p anr-ort --test dfn3 -- --ignored
      - name: Run CLI without inference backend
        run: cargo test --locked -p anr-cli --no-default-features
      - name: Run compute CLI tests without requiring GPU hardware
        run: cargo test --locked -p anr-cli --no-default-features --features gl,gles,vk,wgpu,dx,cuda,opencl
      - name: Formatting and lint gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --exclude anr-tensorrt --exclude anr-openvino --all-targets -- -D warnings
          cargo check --locked --workspace --exclude anr-tensorrt --exclude anr-openvino --all-targets --features "anr-cli/gl,anr-cli/gles,anr-cli/vk,anr-cli/wgpu,anr-cli/dx,anr-cli/cuda,anr-cli/opencl,anr-cli/ort-load-dynamic,anr-cli/ort-cuda,anr-cli/ort-tensorrt,anr-cli/ort-directml,anr-cli/ort-coreml,anr-cli/ort-xnnpack,anr-bench/ort-load-dynamic,anr-bench/ort-cuda,anr-bench/ort-tensorrt,anr-bench/ort-directml,anr-lite/wgpu"
      - name: Build workspace documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --exclude anr-tensorrt --exclude anr-openvino --no-deps
      - name: Test retry-safe dynamic runtime initialization
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          library = {"Windows": "onnxruntime.dll", "Linux": "libonnxruntime.so", "macOS": "libonnxruntime.dylib"}[os.environ["RUNNER_OS"]]
          environment = os.environ.copy()
          environment["ORT_DYLIB_PATH"] = str(Path(os.environ["RUNNER_TEMP"]) / "ort-distribution/lib" / library)
          subprocess.run([
              "cargo", "test", "--locked", "-p", "anr-ort", "--no-default-features",
              "--features", "load-dynamic", "--test", "runtime",
          ], check=True, env=environment)
      - name: Build distributable CPU CLI
        run: cargo build --locked --release -p anr-cli --no-default-features --features ort-load-dynamic
      - name: Bundle CLI, runtime, model and licenses
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          executable = "anr.exe" if os.name == "nt" else "anr"
          runtime = Path(os.environ["RUNNER_TEMP"]) / "ort-distribution"
          subprocess.run([
              sys.executable, ".github/scripts/package_release.py",
              "--binary", str(Path("target/release") / executable),
              "--target", os.environ["PACKAGE_TARGET"], "--label", os.environ["PACKAGE_LABEL"],
              "--model-dir", "models", "--runtime-lib-dir", str(runtime / "lib"),
              "--runtime-notice-dir", str(runtime), "--output-dir", "dist",
          ], check=True)
      - name: Run the extracted ZIP outside the source tree
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          archives = list(Path("dist").glob("*.zip"))
          if len(archives) != 1:
              raise RuntimeError(f"expected one native ZIP, found {archives}")
          subprocess.run([
              sys.executable, ".github/scripts/smoke_release.py",
              "--archive", str(archives[0]), "--control-model", "crates/anr-cli/tests/fixtures/control.onnx",
          ], check=True)
      - name: Upload verified native ZIP
        uses: actions/upload-artifact@v4
        with:
          name: anr-${{ matrix.platform.host }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified ZIPs
    needs: [prepare, native-cli]
    if: github.event_name == 'push' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: anr-*
          merge-multiple: true
          path: dist
      - name: Publish complete release without replacing existing assets
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_LABEL: ${{ needs.prepare.outputs.label }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          import os
          import subprocess
          import sys
          command = [
              sys.executable, ".github/scripts/publish_release.py",
              "--repository", os.environ["GITHUB_REPOSITORY"], "--tag", os.environ["RELEASE_TAG"],
              "--label", os.environ["RELEASE_LABEL"], "--commit", os.environ["RELEASE_COMMIT"],
              "--directory", "dist",
          ]
          if os.environ["RELEASE_PRERELEASE"] == "true":
              command.append("--prerelease")
          subprocess.run(command, check=True)
