[package]
name = "anr-wgpu"
description = "Model-specific DeepFilterNet3 inference with native wgpu compute shaders"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/lona-cn/anr"
include = ["src/**", "tests/dfn3.rs", "tests/fixtures/reference_*.f32le", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anr-core.workspace = true
anr-dfn3.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
bytemuck = "1.24"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "dx12", "metal"] }
pollster = "0.4"

[dev-dependencies]
tempfile = "3.27"
