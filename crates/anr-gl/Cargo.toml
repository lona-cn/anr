[package]
name = "anr-gl"
description = "Model-specific DeepFilterNet3 inference with OpenGL compute shaders"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/lona-cn/anr"
include = ["src/**", "tests/dfn3.rs", "tests/fixtures/reference_*.f32le", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anr-core.workspace = true
anr-dfn3 = { workspace = true, features = ["glsl"] }
bytemuck = "1.24"
glow = "0.16"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
glutin = { version = "0.32.3", default-features = false, features = ["egl", "wgl"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27"
