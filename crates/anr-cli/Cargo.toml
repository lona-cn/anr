[package]
name = "anr-cli"
description = "Cross-platform file and streaming audio noise reduction"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["audio", "noise-reduction", "denoise", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md"]

[[bin]]
name = "anr"
path = "src/main.rs"
doc = false

[dependencies]
anr.workspace = true
anyhow = "1.0"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5"
file-id = "0.2.3"
hound = "3.5.1"
rubato = "0.16.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.5", default-features = false, features = ["all"] }
tempfile = "3.27"

[features]
default = ["ort-download-binaries"]
ort = ["anr/ort"]
gl = ["anr/gl"]
ort-download-binaries = ["ort", "anr/ort-download-binaries"]
ort-load-dynamic = ["ort", "anr/ort-load-dynamic"]
ort-cuda = ["ort", "anr/ort-cuda"]
ort-tensorrt = ["ort", "anr/ort-tensorrt"]
ort-directml = ["ort", "anr/ort-directml"]
ort-coreml = ["ort", "anr/ort-coreml"]
ort-xnnpack = ["ort", "anr/ort-xnnpack"]

