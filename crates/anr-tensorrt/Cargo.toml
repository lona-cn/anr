[package]
name = "anr-tensorrt"
description = "Native TensorRT standard-layer DFN3 inference with CUDA DSP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/lona-cn/anr"
readme = "../../README.md"
include = ["src/**", "native/**", "build.rs", "tests/dfn3.rs", "tests/fixtures/reference_*.f32le", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anr-core.workspace = true
anr-dfn3.workspace = true

libloading = "0.8"
[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3.27"
