[package]
name = "anr-vk"
description = "Model-specific DeepFilterNet3 inference with native Vulkan compute"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/lona-cn/anr"
readme = "../../README.md"
include = ["src/**", "tests/dfn3.rs", "tests/fixtures/reference_*.f32le", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anr-core.workspace = true
anr-dfn3 = { workspace = true, features = ["spirv"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "debug", "std"] }

[dev-dependencies]
tempfile = "3.27"
