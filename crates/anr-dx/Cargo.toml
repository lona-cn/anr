[package]
name = "anr-dx"
description = "Model-specific DeepFilterNet3 inference with native D3D12 compute shaders"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/lona-cn/anr"
include = ["src/**", "tests/dfn3.rs", "tests/fixtures/reference_*.f32le", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anr-core.workspace = true
anr-dfn3.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
anr-dfn3 = { workspace = true, features = ["hlsl"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27"
