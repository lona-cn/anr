[package]
name = "anr-cuda"
description = "Model-specific DeepFilterNet3 inference with native CUDA graph compute"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/lona-cn/anr"
readme = "../../README.md"
include = ["src/**", "tests/dfn3.rs", "tests/fixtures/reference_*.f32le", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anr-core.workspace = true
anr-dfn3.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"] }
libloading = "0.9"

[dev-dependencies]
tempfile = "3.27"
