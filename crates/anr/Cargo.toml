[package]
name = "anr"
description = "Audio noise reduction with a shared interface and optional inference backends"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/lona-cn/anr"
documentation = "https://docs.rs/anr"
keywords = ["audio", "noise-reduction", "denoise", "deepfilternet"]
categories = ["multimedia::audio"]
include = ["src/**", "build.rs", "examples/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
anr-core.workspace = true
anr-ort = { workspace = true, optional = true }
anr-gl = { workspace = true, optional = true }
anr-gles = { workspace = true, optional = true }
anr-vk = { workspace = true, optional = true }
anr-wgpu = { workspace = true, optional = true }
anr-dx = { workspace = true, optional = true }

[build-dependencies]
sha2 = { version = "0.10.9", optional = true }
tempfile = { version = "3.27", optional = true }
ureq = { version = "3", default-features = false, features = ["native-tls", "socks-proxy"], optional = true }

[features]
default = ["ort-download-binaries", "download-models", "copy-models"]
download-models = ["dep:sha2", "dep:tempfile", "dep:ureq"]
copy-models = []
ort = ["dep:anr-ort"]
gl = ["dep:anr-gl"]
gles = ["dep:anr-gles"]
vk = ["dep:anr-vk"]
wgpu = ["dep:anr-wgpu"]
dx = ["dep:anr-dx"]
ort-download-binaries = ["anr-ort?/download-binaries"]
ort-load-dynamic = ["ort", "anr-ort/load-dynamic"]
ort-cuda = ["ort", "anr-ort/cuda"]
ort-tensorrt = ["ort", "anr-ort/tensorrt"]
ort-directml = ["ort", "anr-ort/directml"]
ort-coreml = ["ort", "anr-ort/coreml"]
ort-xnnpack = ["ort", "anr-ort/xnnpack"]

[[example]]
name = "denoise"
required-features = ["ort"]

[package.metadata.docs.rs]
no-default-features = true
features = ["ort-load-dynamic"]
