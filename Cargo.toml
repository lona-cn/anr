[workspace]
resolver = "3"
members = ["crates/anr-core", "crates/anr-ort", "crates/anr", "crates/anr-cli"]
exclude = ["vox-noise-reduction"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anr-core = { version = "0.1.0", path = "crates/anr-core" }
anr-ort = { version = "0.1.0", path = "crates/anr-ort" }
anr = { version = "0.1.0", path = "crates/anr", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-27"] }
